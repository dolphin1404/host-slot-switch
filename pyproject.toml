[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "host-slot-switch"
version = "0.2.0"
description = "Switch multi-host pointing-device slots from a keyboard shortcut"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [
  { name = "Host Slot Switch contributors" },
]
keywords = ["logitech", "mx-vertical", "easy-switch", "solaar", "hidpp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]
dependencies = [
  "hidapi>=0.15,<1; platform_system == 'Windows'",
]

[project.urls]
Homepage = "https://github.com/dolphin1404/host-slot-switch"
Repository = "https://github.com/dolphin1404/host-slot-switch"
Issues = "https://github.com/dolphin1404/host-slot-switch/issues"

[project.scripts]
host-slot-switch = "host_slot_switch.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
